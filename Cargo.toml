[workspace]
resolver = "2"
members = ["crates/twm-core", "crates/twm", "crates/twmctl", "crates/twm-testwin", "tools/platform-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VVVULTURE/TilingWindowsManager"
rust-version = "1.85"

[workspace.dependencies]
twm-core = { path = "crates/twm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_ignored = "0.1"
regex = "1"
windows = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
